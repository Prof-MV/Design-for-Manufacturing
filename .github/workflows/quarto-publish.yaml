on:
  push:
    branches:
      - quarto-migration
      - master
  workflow_dispatch:

name: Render and Publish (Quarto)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rsvg-convert (SVG -> PDF for LaTeX)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::bookdown
            any::dplyr
            any::tidyr
            any::ggplot2
            any::kableExtra
            any::stringr
            any::gridExtra
            any::ggforce
            any::plotly

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render book (HTML, PDF, EPUB)
        run: quarto render

      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
