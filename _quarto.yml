project:
  type: book
  output-dir: docs

book:
  title: "Design for Manufacturing"
  author: "Martin Volkening and Claude Opus 4.6 (Anthropic)"
  date: today
  url: https://github.com/Prof-MV/Design-for-Manufacturing
  repo-url: https://github.com/Prof-MV/Design-for-Manufacturing
  repo-actions: [edit]
  cover-image: images/Fanshawe.png
  description: |
    This book collects design guidelines to be used for different manufacturing processes.
  page-footer:
    left: "Design for Manufacturing"
    right: "Built with Quarto"
  chapters:
    - index.qmd
    - part: "Design and Drafting"
      chapters:
        - 01-00-Design.qmd
        - 01-01-Drafting.qmd
        - 01-02-Dimensioning.qmd
        - 01-03-Tolerances.qmd
        - 01-04-GDandT.qmd
        - 01-05-Imperial-Metric-Fits.qmd
    - part: "Machine Elements"
      chapters:
        - 02-00-Machine-Elements.qmd
        - 02-01-Bolt-Joint-Calculations.qmd
        - 02-02-Gears.qmd
        - 02-03-Bearings.qmd
        - 02-04-Planar-Linkages.qmd
        - 02-05-Four-Bar-Linkage.qmd
        - 02-06-Cam-Follower.qmd
        - 02-07-Belt-Pulley.qmd
        - 02-08-Chain-Drives.qmd
        - 02-09-Couplings-Clutches.qmd
        - 02-10-Automotive-Drivetrains.qmd
        - 02-11-Brakes.qmd
        - 02-12-Thermodynamics.qmd
    - part: "Design for Manufacturing"
      chapters:
        - 03-00-Design-for-Manufacturing.qmd
        - 03-01-Casting.qmd
        - 03-02-Joining.qmd
        - 03-03-Stamping.qmd
        - 03-04-Welding.qmd
        - 03-05-Machining.qmd
        - 03-06-Design-for-3D-printing.qmd
        - 03-07-Sintering.qmd
    - part: "Machine Learning for Manufacturing"
      chapters:
        - 04-01-Machine-Learning.qmd
        - 04-02-Machine-Learning-Lab.qmd
    - part: "Finite Element Analysis"
      chapters:
        - 05-01-FEA-SolidWorks.qmd
  page-navigation: true

bibliography: [book.bib, packages.bib]
link-citations: true

format:
  html:
    theme: cosmo
    css: style.css
    number-sections: true
  pdf:
    documentclass: book
    include-in-header: preamble.tex
    latex-engine: xelatex
    citation-package: natbib
    keep-tex: true
  epub:
    cover-image: images/Fanshawe.png

execute:
  freeze: auto
